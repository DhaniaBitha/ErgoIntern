        /* Hide scrollbar for Chrome, Safari and Opera */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        /* Hide scrollbar for IE, Edge and Firefox */
        .no-scrollbar {
            -ms-overflow-style: none;  /* IE and Edge */
            scrollbar-width: none;  /* Firefox */
        }
        
        /* Auto Infinite Scroll Animation */
        @keyframes scroll {
            0% { transform: translateX(0); }
            100% { transform: translateX(-50%); }
        }
        .animate-marquee {
            display: flex;
            width: 200%;
            animation: scroll 25s linear infinite;
        }
        .animate-marquee:hover {
            animation-play-state: paused;
        }

        /* Gradient Background Diagonal (#F3D8A6 ke #7A5239) */
        body {
            background: linear-gradient(135deg, #F3D8A6 0%, #7A5239 100%);
            background-attachment: fixed;
        }

        /* Keyframes untuk Efek Kelap-Kelip Bintang */
        @keyframes twinkle {
            0%, 100% {
                opacity: 0.2;
                transform: scale(0.8);
            }
            50% {
                opacity: 0.9;
                transform: scale(1.1);
            }
        }

        .star-particle {
            position: absolute;
            background-image: url('star1background.png');
            background-size: contain;
            background-repeat: no-repeat;
            pointer-events: none;
            animation: twinkle var(--duration, 3s) infinite ease-in-out var(--delay, 0s);
        }
    </style>

            const totalStars = 28;

            for (let i = 0; i < totalStars; i++) {
                const star = document.createElement('div');
                star.className = 'star-particle';
                
                const size = Math.floor(Math.random() * 16) + 12;
                const top = Math.random() * 100;
                const left = Math.random() * 100;
                const duration = (Math.random() * 3 + 2).toFixed(1);
                const delay = (Math.random() * 4).toFixed(1);

                star.style.width = `${size}px`;
                star.style.height = `${size}px`;
                star.style.top = `${top}%`;
                star.style.left = `${left}%`;
                star.style.setProperty('--duration', `${duration}s`);
                star.style.setProperty('--delay', `${delay}s`);

                container.appendChild(star);
            }
        }

        // System Navigasi Halaman
        function showPage(pageId) {
            document.querySelectorAll('.page-content').forEach(page => {
                page.classList.add('hidden');
            });
            document.getElementById(`page-${pageId}`).classList.remove('hidden');
            window.scrollTo(0, 0);
        }

        // Render Card List
        function renderCards() {
            const containerKP = document.getElementById('grid-kp');
            const containerMagang = document.getElementById('grid-magang');

            containerKP.innerHTML = '';
            const containerMagangEl = document.getElementById('grid-magang');
            containerMagangEl.innerHTML = '';

            asistenData.forEach(item => {
                const cardHTML = `
                    <div onclick="openDetail(${item.id})" class="bg-[#FFFCEB]/80 backdrop-blur-md rounded-xl border border-white/50 p-5 shadow-sm hover:shadow-md transition cursor-pointer flex items-center gap-4">
                        <img src="${item.foto}" class="w-16 h-16 rounded-full object-cover border border-[#7A5239]" alt="${item.inisial}">
                        <div class="space-y-1">
                            <div class="flex items-center gap-2">
                                <span class="text-xs font-bold bg-[#7A5239]/10 text-[#7A5239] px-2 py-0.5 rounded">${item.inisial}</span>
                                <span class="text-xs text-gray-500 font-medium">${item.namaLengkap.split(' ')[0]}</span>
                            </div>
                            <h4 class="font-bold text-gray-800 line-clamp-1">${item.namaPerusahaan}</h4>
                            <p class="text-xs text-[#4B2D19] font-medium flex items-center gap-1">
                                Klik untuk detail <i data-lucide="chevron-right" class="w-3 h-3"></i>
                            </p>
                        </div>
                    </div>
                `;

                if (item.tipe === "KP") {
                    containerKP.innerHTML += cardHTML;
                } else {
                    containerMagangEl.innerHTML += cardHTML;
                }
            });

            if (containerMagangEl.children.length === 0) {
                containerMagangEl.innerHTML = `<p class="col-span-full text-center text-gray-700 italic bg-white/40 p-6 rounded-xl">Data Magang belum tersedia saat ini.</p>`;
            }

            lucide.createIcons();
        }

        // Open Detail Page
        function openDetail(id) {
            const item = asistenData.find(a => a.id === id);
            if (!item) return;

            const isKP = item.tipe === 'KP';

            document.getElementById('detail-title').innerText = `${isKP ? 'Kerja Praktek' : 'Magang'} - ${item.inisial}`;
            document.getElementById('detail-back-btn').setAttribute('onclick', `showPage('${isKP ? 'explore-kp' : 'explore-magang'}')`);
            document.getElementById('detail-foto').src = item.foto;
            document.getElementById('detail-nama').innerText = item.namaLengkap;
            document.getElementById('detail-inisial-badge').innerText = `Inisial: ${item.inisial}`;
            document.getElementById('detail-perusahaan').innerText = item.namaPerusahaan;
            document.getElementById('detail-alamat').querySelector('span').innerText = item.alamat;
            document.getElementById('detail-dospem').innerText = item.dospem;
            
            // Pemisahan Divisi dan Deskripsi Divisi
            document.getElementById('detail-divisi').innerText = item.divisi;
            document.getElementById('detail-deskripsi-divisi').innerText = item.deskripsiDivisi;
            
            // Pendaftaran: Tombol vs Teks
            const pendaftaranContainer = document.getElementById('detail-pendaftaran');
            if (item.pendaftaranType === 'button') {
                pendaftaranContainer.innerHTML = `
                    <p class="mb-3">Pendaftaran dapat dilakukan melalui tautan resmi berikut:</p>
                    <a href="${item.pendaftaranUrl}" target="_blank" class="inline-flex items-center gap-2 px-4 py-2 bg-[#4B2D19] text-[#FFEE99] font-medium text-sm rounded-lg hover:opacity-90 transition shadow-sm">
                        <span>${item.pendaftaranLabel}</span>
                        <i data-lucide="external-link" class="w-4 h-4"></i>
                    </a>
                `;
            } else {
                pendaftaranContainer.innerHTML = `<p>${item.pendaftaranText}</p>`;
            }

            document.getElementById('detail-kendala').innerText = item.kendala;
            document.getElementById('detail-saran').innerText = item.saran;

            // Detail Fitur Output File
            const outputTitle = document.getElementById('detail-output-title');
            const outputContent = document.getElementById('detail-output-content');
            
            outputTitle.querySelector('span').innerText = isKP ? "File Output Kerja Praktik" : "File Output Magang";
            
            
if (item.fileType === "button" && item.fileUrl) {
    outputContent.innerHTML = `
        <a href="${item.fileUrl}"
           target="_blank"
           rel="noopener noreferrer"
           class="inline-flex items-center gap-2 px-4 py-2 bg-emerald-700 text-white font-medium text-sm rounded-lg hover:bg-emerald-800 transition shadow-sm">
            <i data-lucide="external-link" class="w-4 h-4"></i>
            ${item.fileLabel || "Lihat File Output"}
        </a>
    `;
} else {
    outputContent.innerHTML = `
        <p class="italic text-gray-500">
            Belum ada file output yang diunggah.
        </p>
    `;
}

            // Render Dokumentasi Foto
            const docContainer = document.getElementById('detail-dokumentasi');
            docContainer.innerHTML = '';
            if (item.dokumentasi && item.dokumentasi.length > 0) {
                item.dokumentasi.forEach(imgUrl => {
                    docContainer.innerHTML += `
                        <img src="${imgUrl}" class="w-60 h-36 rounded-lg object-cover flex-shrink-0 border border-gray-200 shadow-sm" alt="Dokumentasi">
                    `;
                });
            } else {
                docContainer.innerHTML = `<p class="text-sm text-gray-400 italic">Tidak ada foto dokumentasi</p>`;
            }

            lucide.createIcons();
            showPage('detail');
        }

        // Initialize Icons, Stars & Apps
        window.onload = () => {
            lucide.createIcons();
            generateStars();
            renderCards();
        };
    </script>
</body>
</html>
